site_name: AgentCraft
site_description: A curated library of scripts, skills, and flows for O&G and API auditing — built from 9 years of fieldwork.
site_author: Aiham Alhawar
repo_url: https://github.com/My-cyberx/AgentCraft
repo_name: My-cyberx/AgentCraft
edit_uri: edit/main/site/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Library:
    - Overview: library/index.md
    - Drilling: library/drilling/index.md
    - HSE: library/hse/index.md
    - Operations:
      - Overview: library/operations/index.md
      - SME Audit: library/operations/sme-audit/flow-audit-deliverable.md
      - LSS:
        - Overview: library/operations/lss/index.md
        - DMAIC: library/operations/lss/dmaic-template.md
        - Fishbone: library/operations/lss/fishbone.md
        - Pareto: library/operations/lss/pareto.md
    - Quality: library/quality/index.md
  - Examples: examples/index.md
  - Install: install.md
  - Integrations: integrations.md
  - Deployment: deployment.md
  - FAQ: faq.md
  - Compare: compare.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/My-cyberx/AgentCraft
      name: AgentCraft on GitHub
  generator: false
plugins:
  - search
